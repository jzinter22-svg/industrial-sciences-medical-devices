<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270" role="img" aria-label="جهاز الاشعة السينية المقطعية بالحاسوب (CT)">
  <!-- gantry housing block -->
  <rect x="130" y="40" width="180" height="170" rx="18" fill="#cbd5e1" stroke="#263238" stroke-width="2.5"></rect>

  <!-- gantry bore (donut) -->
  <circle cx="220" cy="125" r="68" fill="#94a3b8" stroke="#263238" stroke-width="2.5"></circle>
  <circle cx="220" cy="125" r="40" fill="#e2e8f0" stroke="#263238" stroke-width="2.5"></circle>

  <!-- rotating detector ring hint -->
  <circle cx="220" cy="125" r="54" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 5" opacity="0.7"></circle>

  <!-- patient table sliding through the bore -->
  <rect x="60" y="118" width="360" height="16" rx="4" fill="#cbd5e1" stroke="#263238" stroke-width="2.5"></rect>
  <line x1="80" y1="134" x2="80" y2="216" stroke="#263238" stroke-width="3"></line>
  <line x1="360" y1="134" x2="360" y2="200" stroke="#263238" stroke-width="3"></line>

  <!-- simplified patient lying through the bore -->
  <g fill="#bfdbfe" stroke="#263238" stroke-width="1.5">
    <ellipse cx="188" cy="112" rx="13" ry="10"></ellipse>
    <rect x="200" y="104" width="190" height="16" rx="8"></rect>
  </g>

  <!-- console / workstation -->
  <g stroke="#263238" stroke-width="2" fill="none">
    <rect x="392" y="150" width="66" height="52" rx="4" fill="#e2e8f0"></rect>
  </g>
  <rect x="398" y="156" width="54" height="30" rx="2" fill="#1d4ed8"></rect>
  <g stroke="#93c5fd" stroke-width="1.2" opacity="0.8">
    <line x1="400" y1="163" x2="450" y2="163"></line>
    <line x1="400" y1="170" x2="450" y2="170"></line>
    <line x1="400" y1="177" x2="450" y2="177"></line>
  </g>
  <line x1="398" y1="196" x2="452" y2="196" stroke="#263238" stroke-width="1.5"></line>
</svg>
