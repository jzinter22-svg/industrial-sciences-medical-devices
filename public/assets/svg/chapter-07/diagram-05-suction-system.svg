<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500">
  <defs>
    <style>
      .dark-box { fill: #2a3f4d; stroke: #4a6578; stroke-width: 2; }
      .light-box { fill: #3d5a6d; stroke: #5a7a8f; stroke-width: 2; }
      .pump { fill: #445a6d; stroke: #6a7f8f; stroke-width: 2; }
      .container { fill: none; stroke: #5a7a8f; stroke-width: 2.5; }
      .arrow { stroke: #6a8fa5; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .text { fill: #e8eef2; font-family: Arial, sans-serif; font-size: 12px; font-weight: 600; }
      .label { fill: #b8c5d1; font-family: Arial, sans-serif; font-size: 10px; }
      .valve { fill: #8fa5b8; }
      .debris { fill: #6a8fa5; opacity: 0.4; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#6a8fa5"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="25" text-anchor="middle" class="text" font-size="16" font-weight="700">نظام الشفط والتفريغ</text>

  <!-- Patient Chair -->
  <ellipse cx="100" cy="90" rx="30" ry="40" fill="#3d5a6d" stroke="#5a7a8f" stroke-width="1.5" opacity="0.6"/>
  <text x="100" y="150" text-anchor="middle" class="label" font-size="10">فم المريض</text>

  <!-- Suction Tips -->
  <g id="suction-tips">
    <!-- Main suction tip -->
    <line x1="100" y1="130" x2="100" y2="160" stroke="#a8d0e8" stroke-width="3"/>
    <circle cx="100" cy="165" r="6" class="valve"/>
    <text x="115" y="170" class="label" font-size="9">سحب رئيسي</text>

    <!-- Auxiliary suction -->
    <line x1="70" y1="125" x2="50" y2="155" stroke="#a8d0e8" stroke-width="2"/>
    <circle cx="45" cy="160" r="5" class="valve"/>
    <text x="30" y="170" class="label" font-size="8">مساعد</text>
  </g>

  <!-- Connection tube to collection -->
  <path d="M 100 170 Q 150 200, 200 250" stroke="#a8d0e8" stroke-width="3" fill="none"/>
  <path d="M 45 165 Q 100 210, 180 250" stroke="#a8d0e8" stroke-width="2" fill="none"/>

  <!-- Collection Container -->
  <g id="collection-container">
    <rect x="180" y="250" width="80" height="100" rx="3" class="container"/>
    <rect x="190" y="260" width="60" height="80" fill="#1a2a35" opacity="0.8"/>

    <!-- Debris in container -->
    <circle cx="210" cy="290" r="3" class="debris"/>
    <circle cx="230" cy="310" r="2.5" class="debris"/>
    <circle cx="220" cy="325" r="2" class="debris"/>
    <circle cx="215" cy="305" r="2.5" class="debris"/>

    <!-- Fluid level line -->
    <line x1="185" y1="310" x2="265" y2="310" stroke="#6a8fa5" stroke-width="1" stroke-dasharray="2,2"/>

    <text x="220" y="365" text-anchor="middle" class="text" font-size="11">حاوية التجميع</text>
    <text x="220" y="378" text-anchor="middle" class="label">Collection Cup</text>

    <!-- Drain valve -->
    <circle cx="260" cy="350" r="6" class="valve"/>
    <text x="275" y="355" class="label" font-size="9">تفريغ</text>
  </g>

  <!-- Suction Pump Motor -->
  <g id="suction-pump">
    <rect x="340" y="250" width="80" height="100" rx="3" class="light-box"/>

    <!-- Motor -->
    <circle cx="380" cy="280" r="22" class="pump"/>
    <circle cx="380" cy="280" r="14" fill="#2a3f4d"/>

    <!-- Pump chamber -->
    <rect x="350" y="310" width="60" height="30" rx="2" class="dark-box"/>
    <circle cx="365" cy="325" r="5" fill="#8fa5b8"/>
    <circle cx="395" cy="325" r="5" fill="#8fa5b8"/>

    <text x="380" y="365" text-anchor="middle" class="text" font-size="11">مضخة الشفط</text>
    <text x="380" y="378" text-anchor="middle" class="label">Suction Pump</text>

    <!-- Connection -->
    <line x1="340" y1="300" x2="260" y2="300" class="arrow" stroke-width="2.5"/>
  </g>

  <!-- Vacuum Gauge -->
  <circle cx="500" cy="300" r="25" class="dark-box"/>
  <circle cx="500" cy="300" r="15" fill="none" stroke="#8fa5b8" stroke-width="1"/>
  <line x1="500" y1="290" x2="510" y2="280" stroke="#d4854f" stroke-width="2.5"/>
  <circle cx="500" cy="300" r="2" fill="#d4854f"/>
  <text x="500" y="340" text-anchor="middle" class="text" font-size="10">مقياس</text>
  <text x="500" y="353" text-anchor="middle" class="label" font-size="9">Vacuum Meter</text>

  <!-- Connection to gauge -->
  <line x1="420" y1="300" x2="475" y2="300" class="arrow" stroke-width="1.5"/>

  <!-- Drain tube to external -->
  <path d="M 220 350 L 220 400 L 50 400" stroke="#6a8fa5" stroke-width="2" fill="none"/>
  <circle cx="45" cy="405" r="3" fill="#6a8fa5"/>
  <text x="40" y="420" class="label" font-size="9">تفريغ خارجي</text>

  <!-- Control and Filter System -->
  <g id="control-system">
    <rect x="30" y="430" width="540" height="50" rx="3" fill="#2a3f4d" stroke="#4a6578" stroke-width="1.5"/>

    <text x="60" y="455" class="text" font-size="11">نظام التحكم والتنقية:</text>

    <!-- Filter component -->
    <rect x="240" y="440" width="60" height="30" rx="2" class="light-box"/>
    <circle cx="270" cy="447" r="4" fill="#8fa5b8"/>
    <circle cx="270" cy="460" r="4" fill="#8fa5b8"/>
    <text x="270" y="475" text-anchor="middle" class="label" font-size="8">فلتر</text>

    <!-- Regulation valve -->
    <rect x="330" y="440" width="60" height="30" rx="2" class="dark-box"/>
    <line x1="345" y1="455" x2="375" y2="455" stroke="#8fa5b8" stroke-width="1.5"/>
    <circle cx="350" cy="455" r="3" fill="#d4854f"/>
    <text x="360" y="475" text-anchor="middle" class="label" font-size="8">منظم</text>

    <!-- Trap component -->
    <rect x="420" y="440" width="60" height="30" rx="2" class="light-box"/>
    <rect x="430" y="448" width="40" height="14" rx="1" fill="#1a2a35"/>
    <text x="450" y="475" text-anchor="middle" class="label" font-size="8">مصيدة</text>

    <!-- Maintenance indicator -->
    <circle cx="520" cy="455" r="8" fill="#d4854f" opacity="0.7"/>
    <text x="520" y="475" text-anchor="middle" class="label" font-size="8">صيانة</text>
  </g>
</svg>
