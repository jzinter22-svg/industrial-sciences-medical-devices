<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 550" width="600" height="550">
  <defs>
    <style>
      .dark-box { fill: #2a3f4d; stroke: #4a6578; stroke-width: 2; }
      .light-box { fill: #3d5a6d; stroke: #5a7a8f; stroke-width: 2; }
      .wire { stroke: #8fa5b8; stroke-width: 2; fill: none; }
      .power { stroke: #d4854f; stroke-width: 2.5; fill: none; }
      .control { stroke: #7eb3cc; stroke-width: 1.5; fill: none; }
      .component { fill: #445a6d; stroke: #6a7f8f; stroke-width: 1.5; }
      .text { fill: #e8eef2; font-family: Arial, sans-serif; font-size: 12px; font-weight: 600; }
      .label { fill: #b8c5d1; font-family: Arial, sans-serif; font-size: 10px; }
      .switch { fill: #8fa5b8; }
      .indicator { fill: #4aad44; }
      .warning { fill: #d4854f; }
    </style>
  </defs>

  <!-- Title -->
  <text x="300" y="25" text-anchor="middle" class="text" font-size="16" font-weight="700">الدائرة الكهربائية للتحكم</text>

  <!-- Power Supply Section -->
  <g id="power-section">
    <text x="30" y="65" class="text" font-size="12">مصدر التيار الكهربائي</text>
    <circle cx="100" cy="100" r="20" class="component"/>
    <text x="100" y="108" text-anchor="middle" class="label" font-size="9">220V</text>

    <!-- Main power switch -->
    <line x1="120" y1="100" x2="160" y2="100" class="power"/>
    <rect x="160" y="90" width="20" height="20" rx="2" class="component"/>
    <circle cx="170" cy="100" r="3" class="switch"/>
    <text x="175" y="110" class="label" font-size="9">مفتاح</text>
    <text x="175" y="122" class="label" font-size="8">رئيسي</text>

    <!-- Circuit breaker -->
    <line x1="180" y1="100" x2="220" y2="100" class="power"/>
    <rect x="220" y="85" width="30" height="30" rx="2" fill="none" stroke="#d4854f" stroke-width="2"/>
    <line x1="225" y1="95" x2="245" y2="110" stroke="#d4854f" stroke-width="1.5"/>
    <text x="235" y="125" class="label" font-size="8">قاطع</text>
  </g>

  <!-- Motor Control Circuit -->
  <g id="motor-control">
    <text x="30" y="180" class="text" font-size="12">تحكم المحركات الهوائية</text>

    <!-- Motor 1 - Pump -->
    <rect x="100" y="200" width="60" height="40" rx="3" class="light-box"/>
    <circle cx="130" cy="220" r="12" class="component"/>
    <text x="130" y="245" text-anchor="middle" class="label" font-size="9">محرك الضاغط</text>

    <!-- Starter -->
    <line x1="70" y1="220" x2="100" y2="220" class="control"/>
    <rect x="30" y="205" width="40" height="30" rx="2" class="dark-box"/>
    <circle cx="50" cy="220" r="4" class="indicator"/>
    <text x="50" y="245" text-anchor="middle" class="label" font-size="8">ستارتر 1</text>

    <!-- Motor 2 - Chair Pump -->
    <rect x="320" y="200" width="60" height="40" rx="3" class="light-box"/>
    <circle cx="350" cy="220" r="12" class="component"/>
    <text x="350" y="245" text-anchor="middle" class="label" font-size="9">مضخة الكرسي</text>

    <!-- Starter -->
    <line x1="290" y1="220" x2="320" y2="220" class="control"/>
    <rect x="250" y="205" width="40" height="30" rx="2" class="dark-box"/>
    <circle cx="270" cy="220" r="4" class="indicator"/>
    <text x="270" y="245" text-anchor="middle" class="label" font-size="8">ستارتر 2</text>

    <!-- Motor 3 - Suction -->
    <rect x="440" y="200" width="60" height="40" rx="3" class="light-box"/>
    <circle cx="470" cy="220" r="12" class="component"/>
    <text x="470" y="245" text-anchor="middle" class="label" font-size="9">مضخة الشفط</text>

    <!-- Starter -->
    <line x1="410" y1="220" x2="440" y2="220" class="control"/>
    <rect x="370" y="205" width="40" height="30" rx="2" class="dark-box"/>
    <circle cx="390" cy="220" r="4" class="indicator"/>
    <text x="390" y="245" text-anchor="middle" class="label" font-size="8">ستارتر 3</text>
  </g>

  <!-- Control Panel Buttons -->
  <g id="control-panel">
    <text x="30" y="320" class="text" font-size="12">لوحة التحكم</text>

    <!-- Main On button -->
    <rect x="80" y="330" width="60" height="50" rx="3" fill="#2a3f4d" stroke="#4aad44" stroke-width="2"/>
    <circle cx="110" cy="360" r="15" fill="#4aad44"/>
    <text x="110" y="365" text-anchor="middle" class="text" font-size="10" fill="#000">تشغيل</text>
    <text x="110" y="395" text-anchor="middle" class="label">Power ON</text>

    <!-- Main Off button -->
    <rect x="160" y="330" width="60" height="50" rx="3" fill="#2a3f4d" stroke="#d4854f" stroke-width="2"/>
    <circle cx="190" cy="360" r="15" fill="#d4854f"/>
    <text x="190" y="365" text-anchor="middle" class="text" font-size="10" fill="#000">إيقاف</text>
    <text x="190" y="395" text-anchor="middle" class="label">Power OFF</text>

    <!-- Selector for device -->
    <rect x="260" y="330" width="80" height="50" rx="3" fill="#2a3f4d" stroke="#7eb3cc" stroke-width="2"/>
    <circle cx="290" cy="355" r="8" class="switch"/>
    <circle cx="320" cy="355" r="8" class="switch"/>
    <text x="280" y="385" text-anchor="middle" class="label" font-size="8">اختيار</text>
    <text x="280" y="395" text-anchor="middle" class="label" font-size="8">الجهاز</text>

    <!-- Emergency stop -->
    <rect x="370" y="330" width="60" height="50" rx="3" fill="#2a3f4d" stroke="#c44444" stroke-width="3"/>
    <circle cx="400" cy="360" r="15" fill="#c44444"/>
    <text x="400" y="365" text-anchor="middle" class="text" font-size="8" fill="#fff">إيقاف</text>
    <text x="400" y="380" text-anchor="middle" class="text" font-size="8" fill="#fff">طوارئ</text>
    <text x="400" y="395" text-anchor="middle" class="label">E-Stop</text>
  </g>

  <!-- Status Indicator Section -->
  <g id="status-indicators">
    <text x="30" y="475" class="text" font-size="12">مؤشرات الحالة</text>

    <!-- Pump running -->
    <circle cx="100" cy="500" r="8" class="indicator"/>
    <text x="120" y="505" class="label" font-size="10">ضاغط يعمل</text>

    <!-- Chair ready -->
    <circle cx="280" cy="500" r="8" class="indicator"/>
    <text x="300" y="505" class="label" font-size="10">كرسي جاهز</text>

    <!-- Suction active -->
    <circle cx="450" cy="500" r="8" class="indicator"/>
    <text x="470" y="505" class="label" font-size="10">شفط نشط</text>

    <!-- Fault indicator -->
    <circle cx="100" cy="530" r="8" fill="#d4854f"/>
    <text x="120" y="535" class="label" font-size="10">عطل أو مشكلة</text>

    <!-- Pressure high -->
    <circle cx="280" cy="530" r="8" fill="#d4854f"/>
    <text x="300" y="535" class="label" font-size="10">ضغط عالي جداً</text>

    <!-- Temperature -->
    <circle cx="450" cy="530" r="8" fill="#d4854f" opacity="0.5"/>
    <text x="470" y="535" class="label" font-size="10">درجة حرارة عالية</text>
  </g>

  <!-- Legend -->
  <g id="legend">
    <line x1="30" y1="420" x2="60" y2="420" class="power"/>
    <text x="70" y="425" class="label" font-size="9">أسلاك التغذية (قوة)</text>

    <line x1="280" y1="420" x2="310" y2="420" class="control"/>
    <text x="320" y="425" class="label" font-size="9">أسلاك التحكم</text>

    <line x1="480" y1="420" x2="510" y2="420" class="wire"/>
    <text x="520" y="425" class="label" font-size="9">أسلاك الأرضي</text>
  </g>
</svg>
