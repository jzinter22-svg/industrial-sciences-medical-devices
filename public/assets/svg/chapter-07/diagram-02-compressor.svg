<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500">
  <defs>
    <style>
      .dark-box { fill: #2a3f4d; stroke: #4a6578; stroke-width: 2; }
      .light-box { fill: #3d5a6d; stroke: #5a7a8f; stroke-width: 2; }
      .motor { fill: #445a6d; stroke: #6a7f8f; stroke-width: 2; }
      .piston { fill: #8fa5b8; stroke: #6a8fa5; stroke-width: 1.5; }
      .chamber { fill: none; stroke: #5a7a8f; stroke-width: 2.5; }
      .arrow { stroke: #6a8fa5; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .text { fill: #e8eef2; font-family: Arial, sans-serif; font-size: 12px; font-weight: 600; }
      .label { fill: #b8c5d1; font-family: Arial, sans-serif; font-size: 10px; }
      .valve { fill: #6a8fa5; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#6a8fa5"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="25" text-anchor="middle" class="text" font-size="16" font-weight="700">نظام الضاغط الهوائي</text>

  <!-- Motor -->
  <rect x="40" y="80" width="100" height="80" rx="5" class="motor"/>
  <circle cx="90" cy="120" r="25" class="piston"/>
  <text x="90" y="155" text-anchor="middle" class="text" font-size="11">محرك كهربائي</text>
  <text x="90" y="168" text-anchor="middle" class="label">Electric Motor</text>

  <!-- Compressor Body -->
  <g id="compressor-head">
    <!-- Main cylinder -->
    <rect x="180" y="80" width="160" height="80" rx="5" class="light-box"/>

    <!-- Piston rod -->
    <line x1="140" y1="120" x2="180" y2="120" stroke="#8fa5b8" stroke-width="4"/>
    <rect x="175" y="115" width="10" height="10" fill="#6a8fa5"/>

    <!-- Intake valve -->
    <circle cx="220" cy="60" r="8" class="valve"/>
    <text x="220" y="45" text-anchor="middle" class="label" font-size="9">مدخل</text>

    <!-- Discharge valve -->
    <circle cx="310" cy="60" r="8" class="valve"/>
    <text x="310" y="45" text-anchor="middle" class="label" font-size="9">مخرج</text>

    <!-- Connection lines -->
    <line x1="220" y1="68" x2="220" y2="80" stroke="#5a7a8f" stroke-width="2"/>
    <line x1="310" y1="68" x2="310" y2="80" stroke="#5a7a8f" stroke-width="2"/>

    <text x="260" y="155" text-anchor="middle" class="text" font-size="11">وحدة الضاغط</text>
    <text x="260" y="168" text-anchor="middle" class="label">Compressor Unit</text>
  </g>

  <!-- Arrow from motor to compressor -->
  <line x1="140" y1="120" x2="180" y2="120" class="arrow" stroke-width="3"/>

  <!-- Air Intake from atmosphere -->
  <path d="M 220 30 L 220 50 M 210 40 L 230 40" stroke="#a8d0e8" stroke-width="2" fill="none"/>
  <text x="240" y="35" class="label">من الجو</text>

  <!-- Compressed Air Output -->
  <line x1="310" y1="60" x2="310" y2="30" stroke="#d4854f" stroke-width="3"/>
  <path d="M 305 30 L 315 30 L 310 20 Z" fill="#d4854f"/>
  <text x="320" y="35" class="text" font-size="10">هواء مضغوط</text>

  <!-- Filter Unit -->
  <rect x="370" y="80" width="80" height="80" rx="5" class="dark-box"/>
  <circle cx="410" cy="100" r="15" class="chamber"/>
  <circle cx="410" cy="140" r="12" fill="#8fa5b8" opacity="0.6"/>
  <text x="410" y="155" text-anchor="middle" class="label" font-size="10">فلتر</text>
  <text x="410" y="168" text-anchor="middle" class="label" font-size="9">Filter</text>

  <!-- Arrow to filter -->
  <line x1="340" y1="120" x2="370" y2="120" class="arrow" stroke-width="2.5"/>

  <!-- Pressure Tank -->
  <ellipse cx="480" cy="120" rx="35" ry="50" class="light-box"/>
  <line x1="515" y1="90" x2="535" y2="70" stroke="#6a8fa5" stroke-width="2"/>
  <circle cx="540" cy="65" r="5" class="valve"/>
  <text x="555" y="70" class="label" font-size="8">أمان</text>
  <text x="480" y="160" text-anchor="middle" class="text" font-size="11">خزان</text>
  <text x="480" y="173" text-anchor="middle" class="label" font-size="10">Tank</text>

  <!-- Arrow to tank -->
  <line x1="450" y1="120" x2="445" y2="120" class="arrow" stroke-width="2.5"/>

  <!-- Pressure gauge -->
  <circle cx="540" cy="120" r="18" class="dark-box"/>
  <circle cx="540" cy="120" r="12" fill="none" stroke="#8fa5b8" stroke-width="1"/>
  <line x1="540" y1="115" x2="548" y2="108" stroke="#d4854f" stroke-width="2"/>
  <circle cx="540" cy="120" r="2" fill="#d4854f"/>
  <text x="540" y="155" text-anchor="middle" class="label" font-size="9">مقياس</text>

  <!-- Output to system -->
  <line x1="515" y1="170" x2="515" y2="200" stroke="#d4854f" stroke-width="3"/>
  <path d="M 510 200 L 520 200 L 515 210 Z" fill="#d4854f"/>
  <text x="525" y="215" class="text" font-size="10">للأجهزة</text>

  <!-- Control Systems info box -->
  <g id="control-info">
    <rect x="40" y="280" width="520" height="190" rx="5" fill="#2a3f4d" stroke="#4a6578" stroke-width="1.5"/>

    <text x="300" y="305" text-anchor="middle" class="text" font-size="13" font-weight="700">مكونات نظام التحكم والتنظيم</text>

    <!-- Control elements -->
    <g id="pressure-regulator">
      <rect x="50" y="320" width="140" height="130" rx="3" fill="#3d5a6d" stroke="#5a7a8f" stroke-width="1"/>
      <circle cx="120" cy="345" r="12" class="valve"/>
      <line x1="120" y1="365" x2="120" y2="385" stroke="#6a8fa5" stroke-width="1.5"/>
      <text x="120" y="410" text-anchor="middle" class="text" font-size="11">منظم الضغط</text>
      <text x="120" y="423" text-anchor="middle" class="label">Pressure Regulator</text>
    </g>

    <g id="safety-valve">
      <rect x="230" y="320" width="140" height="130" rx="3" fill="#3d5a6d" stroke="#5a7a8f" stroke-width="1"/>
      <circle cx="300" cy="345" r="12" class="valve"/>
      <path d="M 300 365 L 295 385 L 305 385 Z" fill="#d4854f"/>
      <text x="300" y="410" text-anchor="middle" class="text" font-size="11">صمام الأمان</text>
      <text x="300" y="423" text-anchor="middle" class="label">Safety Valve</text>
    </g>

    <g id="dehumidifier">
      <rect x="410" y="320" width="140" height="130" rx="3" fill="#3d5a6d" stroke="#5a7a8f" stroke-width="1"/>
      <circle cx="480" cy="345" r="8" fill="#8fa5b8" opacity="0.7"/>
      <circle cx="480" cy="360" r="8" fill="#8fa5b8" opacity="0.7"/>
      <circle cx="480" cy="375" r="8" fill="#8fa5b8" opacity="0.7"/>
      <text x="480" y="410" text-anchor="middle" class="text" font-size="11">مجفف الهواء</text>
      <text x="480" y="423" text-anchor="middle" class="label">Air Dryer</text>
    </g>
  </g>
</svg>
