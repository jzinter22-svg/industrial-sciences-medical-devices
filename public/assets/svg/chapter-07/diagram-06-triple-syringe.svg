<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500">
  <defs>
    <style>
      .dark-box { fill: #2a3f4d; stroke: #4a6578; stroke-width: 2; }
      .light-box { fill: #3d5a6d; stroke: #5a7a8f; stroke-width: 2; }
      .body { fill: #445a6d; stroke: #6a7f8f; stroke-width: 1.5; }
      .liquid { fill: #7eb3cc; opacity: 0.7; }
      .trigger { fill: #8fa5b8; }
      .arrow { stroke: #6a8fa5; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .text { fill: #e8eef2; font-family: Arial, sans-serif; font-size: 12px; font-weight: 600; }
      .label { fill: #b8c5d1; font-family: Arial, sans-serif; font-size: 10px; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#6a8fa5"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="25" text-anchor="middle" class="text" font-size="16" font-weight="700">محقنة الرش الثلاثية</text>

  <!-- Left Syringe - Water -->
  <g id="water-syringe" transform="translate(80, 100)">
    <!-- Barrel -->
    <rect x="0" y="0" width="40" height="120" rx="4" class="body"/>

    <!-- Plunger -->
    <rect x="5" y="-20" width="30" height="25" rx="2" class="light-box"/>
    <line x1="20" y1="0" x2="20" y2="30" stroke="#8fa5b8" stroke-width="2"/>

    <!-- Nozzle -->
    <path d="M 35 60 L 50 60 L 48 55 L 48 65 Z" fill="#8fa5b8"/>

    <!-- Water inside -->
    <rect x="3" y="50" width="34" height="65" rx="2" class="liquid"/>

    <!-- Trigger/Button -->
    <ellipse cx="20" cy="50" rx="18" ry="8" class="trigger"/>
    <text x="20" y="53" text-anchor="middle" class="text" font-size="8">ماء</text>

    <text x="20" y="195" text-anchor="middle" class="text" font-size="11">الماء</text>
    <text x="20" y="208" text-anchor="middle" class="label">Water</text>
  </g>

  <!-- Center Syringe - Air -->
  <g id="air-syringe" transform="translate(260, 100)">
    <!-- Barrel -->
    <rect x="0" y="0" width="40" height="120" rx="4" class="body"/>

    <!-- Plunger -->
    <rect x="5" y="-20" width="30" height="25" rx="2" class="light-box"/>
    <line x1="20" y1="0" x2="20" y2="30" stroke="#8fa5b8" stroke-width="2"/>

    <!-- Nozzle -->
    <path d="M 35 60 L 50 60 L 48 55 L 48 65 Z" fill="#8fa5b8"/>

    <!-- Air inside (lighter) -->
    <rect x="3" y="20" width="34" height="95" rx="2" fill="#d4e8f2" opacity="0.5"/>

    <!-- Trigger/Button -->
    <ellipse cx="20" cy="50" rx="18" ry="8" class="trigger"/>
    <text x="20" y="53" text-anchor="middle" class="text" font-size="8">هواء</text>

    <text x="20" y="195" text-anchor="middle" class="text" font-size="11">الهواء</text>
    <text x="20" y="208" text-anchor="middle" class="label">Air</text>
  </g>

  <!-- Right Syringe - Powder/Slurry -->
  <g id="powder-syringe" transform="translate(440, 100)">
    <!-- Barrel -->
    <rect x="0" y="0" width="40" height="120" rx="4" class="body"/>

    <!-- Plunger -->
    <rect x="5" y="-20" width="30" height="25" rx="2" class="light-box"/>
    <line x1="20" y1="0" x2="20" y2="30" stroke="#8fa5b8" stroke-width="2"/>

    <!-- Nozzle -->
    <path d="M 35 60 L 50 60 L 48 55 L 48 65 Z" fill="#8fa5b8"/>

    <!-- Powder inside -->
    <rect x="3" y="40" width="34" height="75" rx="2" fill="#a8a8a8" opacity="0.6"/>

    <!-- Trigger/Button -->
    <ellipse cx="20" cy="50" rx="18" ry="8" class="trigger"/>
    <text x="20" y="53" text-anchor="middle" class="text" font-size="8">بودرة</text>

    <text x="20" y="195" text-anchor="middle" class="text" font-size="11">بودرة/سائل</text>
    <text x="20" y="208" text-anchor="middle" class="label">Powder</text>
  </g>

  <!-- Connection Block -->
  <rect x="120" y="280" width="360" height="100" rx="5" fill="#2a3f4d" stroke="#4a6578" stroke-width="2"/>

  <!-- Connection manifold -->
  <g id="manifold">
    <rect x="180" y="290" width="240" height="30" rx="3" class="light-box"/>

    <!-- Input connections -->
    <line x1="100" y1="240" x2="180" y2="305" class="arrow" stroke-width="2.5"/>
    <line x1="280" y1="240" x2="270" y2="290" class="arrow" stroke-width="2.5"/>
    <line x1="460" y1="240" x2="380" y2="290" class="arrow" stroke-width="2.5"/>

    <!-- Valve positions -->
    <circle cx="200" cy="305" r="5" class="trigger"/>
    <circle cx="270" cy="305" r="5" class="trigger"/>
    <circle cx="340" cy="305" r="5" class="trigger"/>
    <circle cx="410" cy="305" r="5" class="trigger"/>

    <text x="200" y="325" text-anchor="middle" class="label" font-size="8">1</text>
    <text x="270" y="325" text-anchor="middle" class="label" font-size="8">2</text>
    <text x="340" y="325" text-anchor="middle" class="label" font-size="8">3</text>
    <text x="410" y="325" text-anchor="middle" class="label" font-size="8">4</text>
  </g>

  <!-- Output -->
  <line x1="300" y1="320" x2="300" y2="350" class="arrow" stroke-width="2.5"/>
  <path d="M 295 350 L 305 350 L 300 360 Z" fill="#8fa5b8"/>

  <!-- Spray pattern -->
  <g id="spray-output">
    <path d="M 290 370 L 280 390 M 300 370 L 300 390 M 310 370 L 320 390" stroke="#a8d0e8" stroke-width="1.5" fill="none"/>
    <text x="300" y="410" text-anchor="middle" class="text" font-size="11">الرش المختلط</text>
    <text x="300" y="423" text-anchor="middle" class="label">Mixed Spray</text>
  </g>

  <!-- Functions Description -->
  <g id="functions">
    <text x="130" y="460" class="text" font-size="11" font-weight="700">الوظائف:</text>

    <!-- Function 1 -->
    <circle cx="180" cy="475" r="4" fill="#8fa5b8"/>
    <text x="190" y="480" class="label" font-size="9">تجفيف المنطقة (هواء فقط)</text>

    <!-- Function 2 -->
    <circle cx="380" cy="475" r="4" fill="#8fa5b8"/>
    <text x="390" y="480" class="label" font-size="9">تنظيف (ماء وهواء)</text>

    <!-- Function 3 -->
    <circle cx="180" cy="495" r="4" fill="#8fa5b8"/>
    <text x="190" y="500" class="label" font-size="9">تلميع (بودرة وماء وهواء)</text>
  </g>
</svg>
