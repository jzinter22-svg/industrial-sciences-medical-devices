<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" role="img" aria-label="الدائرة الالكترونية لمرسلة الموجات الفوق الصوتية">
  <rect x="0" y="0" width="820" height="360" fill="none"></rect>
  <g fill="none" stroke="#263238" stroke-width="2">

    <line x1="80" y1="80" x2="780" y2="80"></line>
    <line x1="80" y1="80" x2="80" y2="280"></line>
    <line x1="80" y1="280" x2="780" y2="280"></line>
    <line x1="780" y1="80" x2="780" y2="280"></line>

    <text x="20" y="175" font-family="Cairo, sans-serif" font-size="14" font-weight="700" fill="#263238" text-anchor="start" direction="rtl">المرسلة</text>
    <text x="20" y="192" font-family="Cairo, sans-serif" font-size="11" font-weight="700" fill="#263238" text-anchor="start" direction="ltr">Transmitter</text>

    <!-- C1 -->
    <line x1="150" y1="80" x2="150" y2="130"></line>
    <line x1="140" y1="130" x2="160" y2="130"></line>
    <line x1="140" y1="138" x2="160" y2="138"></line>
    <line x1="150" y1="138" x2="150" y2="175"></line>
    <text x="165" y="118" font-family="Cairo, sans-serif" font-size="11" font-weight="700" fill="#263238">C1</text>

    <!-- C2 -->
    <line x1="150" y1="175" x2="220" y2="175"></line>
    <line x1="220" y1="165" x2="220" y2="185"></line>
    <line x1="228" y1="165" x2="228" y2="185"></line>
    <text x="200" y="205" font-family="Cairo, sans-serif" font-size="11" font-weight="700" fill="#263238">C2</text>

    <!-- L1 crystal oscillator coil -->
    <line x1="228" y1="175" x2="280" y2="175"></line>
    <path d="M 280,175 v-15 a10,10 0 1 1 0,20 a10,10 0 1 1 0,20 a10,10 0 1 1 0,20 v-45" stroke-width="2"></path>
    <text x="300" y="150" font-family="Cairo, sans-serif" font-size="12" font-weight="700" fill="#263238">L1</text>
    <text x="290" y="170" font-family="Cairo, sans-serif" font-size="11" font-weight="700" fill="#263238">2.25MHZ</text>
    <rect x="273" y="205" width="14" height="26" fill="#f87171" stroke="#263238" stroke-width="1.5"></rect>
    <text x="245" y="222" font-family="Cairo, sans-serif" font-size="10" font-weight="700" fill="#263238" text-anchor="end" direction="rtl">البلورة</text>

    <!-- R2 -->
    <line x1="228" y1="80" x2="228" y2="100"></line>
    <path d="M 228,100 l 8,6 -16,6 16,6 -16,6 8,6" stroke-width="2"></path>
    <line x1="228" y1="130" x2="228" y2="175"></line>
    <text x="240" y="105" font-family="Cairo, sans-serif" font-size="11" font-weight="700" fill="#263238">R2</text>

    <!-- R1 -->
    <line x1="330" y1="80" x2="330" y2="100"></line>
    <path d="M 330,100 l 8,6 -16,6 16,6 -16,6 8,6" stroke-width="2"></path>
    <line x1="330" y1="130" x2="330" y2="175"></line>
    <text x="342" y="105" font-family="Cairo, sans-serif" font-size="11" font-weight="700" fill="#263238">R1</text>
    <line x1="280" y1="175" x2="330" y2="175"></line>

    <!-- transistor -->
    <circle cx="330" cy="230" r="24" fill="#fde68a" stroke="#263238" stroke-width="2"></circle>
    <line x1="330" y1="175" x2="330" y2="206"></line>
    <line x1="330" y1="254" x2="330" y2="280"></line>

    <!-- C3 -->
    <line x1="306" y1="230" x2="270" y2="230"></line>
    <line x1="260" y1="220" x2="260" y2="240"></line>
    <line x1="252" y1="220" x2="252" y2="240"></line>
    <line x1="252" y1="230" x2="228" y2="230"></line>
    <line x1="228" y1="175" x2="228" y2="230"></line>
    <text x="248" y="255" font-family="Cairo, sans-serif" font-size="11" font-weight="700" fill="#263238">C3</text>

    <!-- C4 -->
    <line x1="330" y1="175" x2="440" y2="175"></line>
    <line x1="440" y1="165" x2="440" y2="185"></line>
    <line x1="448" y1="165" x2="448" y2="185"></line>
    <text x="435" y="205" font-family="Cairo, sans-serif" font-size="11" font-weight="700" fill="#263238">C4</text>

    <!-- R (unlabeled path) and C5 -->
    <line x1="448" y1="175" x2="520" y2="175"></line>
    <path d="M 500,80 v75" stroke-width="2"></path>
    <path d="M 500,100 l 8,6 -16,6 16,6 -16,6 8,6" stroke-width="2"></path>
    <text x="512" y="105" font-family="Cairo, sans-serif" font-size="11" font-weight="700" fill="#263238">R₂</text>
    <line x1="500" y1="175" x2="520" y2="175"></line>
    <line x1="600" y1="80" x2="600" y2="280"></line>
    <line x1="590" y1="165" x2="610" y2="165"></line>
    <line x1="590" y1="173" x2="610" y2="173"></line>
    <text x="615" y="175" font-family="Cairo, sans-serif" font-size="11" font-weight="700" fill="#263238">C5</text>

    <!-- output to detector -->
    <line x1="600" y1="130" x2="780" y2="130"></line>
    <line x1="700" y1="120" x2="720" y2="120"></line>
    <line x1="700" y1="128" x2="720" y2="128"></line>
    <text x="705" y="112" font-family="Cairo, sans-serif" font-size="11" font-weight="700" fill="#263238">C6</text>
  </g>
  <text x="800" y="120" font-family="Cairo, sans-serif" font-size="13" font-weight="700" fill="#dc2626" text-anchor="end" direction="rtl">الى الكاشف</text>
  <text x="800" y="98" font-family="Cairo, sans-serif" font-size="11" font-weight="700" fill="#dc2626" text-anchor="end" direction="ltr">To Detector</text>
</svg>
