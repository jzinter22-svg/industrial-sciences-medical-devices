<svg xmlns="http://www.w3.org/2000/svg" width="700" height="360" viewBox="0 0 700 360" role="img" aria-label="صور عرض شاشة الاوسيليسكوب للنوعين">
  <rect x="0" y="0" width="700" height="360" fill="none"></rect>

  <!-- (a) A-scan trace panel -->
  <rect x="40" y="20" width="620" height="150" fill="#fef9c3" stroke="#263238" stroke-width="2"></rect>
  <line x1="60" y1="150" x2="640" y2="150" stroke="#263238" stroke-width="2"></line>
  <path d="M 90,150 q 8,-100 16,-100 t 16,100" fill="none" stroke="#263238" stroke-width="2.5"></path>
  <path d="M 260,150 q 6,-40 12,-40 t 12,40" fill="none" stroke="#263238" stroke-width="2.5"></path>
  <path d="M 380,150 q 6,-30 12,-30 t 12,30" fill="none" stroke="#263238" stroke-width="2.5"></path>
  <path d="M 470,150 q 5,-45 10,-45 t 10,45" fill="none" stroke="#263238" stroke-width="2.5"></path>
  <path d="M 495,150 q 5,-55 10,-55 t 10,55" fill="none" stroke="#263238" stroke-width="2.5"></path>
  <path d="M 590,150 q 6,-35 12,-35 t 12,35" fill="none" stroke="#263238" stroke-width="2.5"></path>
  <text x="350" y="190" font-family="Cairo, sans-serif" font-size="16" font-weight="700" fill="#dc2626" text-anchor="middle" direction="ltr">(a)</text>

  <!-- (b) B-scan brightness band -->
  <rect x="40" y="230" width="620" height="60" fill="#bae6fd" stroke="#263238" stroke-width="2"></rect>
  <ellipse cx="270" cy="260" rx="16" ry="6" fill="#111827"></ellipse>
  <ellipse cx="390" cy="260" rx="10" ry="5" fill="#111827"></ellipse>
  <ellipse cx="478" cy="260" rx="7" ry="4" fill="#111827"></ellipse>
  <ellipse cx="502" cy="260" rx="9" ry="5" fill="#111827"></ellipse>
  <ellipse cx="598" cy="260" rx="11" ry="5" fill="#111827"></ellipse>
  <text x="350" y="320" font-family="Cairo, sans-serif" font-size="16" font-weight="700" fill="#dc2626" text-anchor="middle" direction="ltr">(b)</text>

  <!-- dashed correspondence guides -->
  <g stroke="#57606f" stroke-width="1" stroke-dasharray="3 3">
    <line x1="270" y1="150" x2="270" y2="230"></line>
    <line x1="390" y1="150" x2="390" y2="230"></line>
    <line x1="490" y1="150" x2="490" y2="230"></line>
    <line x1="598" y1="150" x2="598" y2="230"></line>
  </g>
</svg>
