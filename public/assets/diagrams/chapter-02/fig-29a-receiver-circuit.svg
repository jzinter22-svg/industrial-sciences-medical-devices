    <line x1="390" y1="60" x2="390" y2="90"></line>
    <path d="M 390,90 l 7,5 -14,6 14,6 -14,6 7,5" stroke-width="2"></path>
    <text x="400" y="95" font-family="Cairo, sans-serif" font-size="10" font-weight="700" fill="#263238">R5</text>
