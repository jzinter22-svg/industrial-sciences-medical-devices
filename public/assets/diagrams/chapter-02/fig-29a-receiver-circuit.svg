<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-label="الدائرة الالكترونية لمستقبلة وكاشف جهاز الصدى الصوتي">
  <rect x="0" y="0" width="900" height="380" fill="none"></rect>
  <g fill="none" stroke="#263238" stroke-width="2">
