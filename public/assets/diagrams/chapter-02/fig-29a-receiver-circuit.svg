    <line x1="610" y1="60" x2="610" y2="90"></line>
    <path d="M 610,90 l 7,5 -14,6 14,6 -14,6 7,5" stroke-width="2"></path>
    <text x="620" y="95" font-family="Cairo, sans-serif" font-size="10" font-weight="700" fill="#263238">R7</text>
    <line x1="610" y1="112" x2="610" y2="300"></line>
    <line x1="660" y1="60" x2="660" y2="90"></line>
    <path d="M 660,90 l 7,5 -14,6 14,6 -14,6 7,5" stroke-width="2"></path>
    <text x="670" y="95" font-family="Cairo, sans-serif" font-size="10" font-weight="700" fill="#263238">R8</text>
    <line x1="660" y1="112" x2="660" y2="300"></line>

    <!-- C8 output -->
    <line x1="710" y1="60" x2="710" y2="140"></line>
    <line x1="700" y1="140" x2="720" y2="140"></line>
    <line x1="700" y1="148" x2="720" y2="148"></line>
    <text x="695" y="130" font-family="Cairo, sans-serif" font-size="10" font-weight="700" fill="#263238">C8</text>
    <line x1="710" y1="148" x2="710" y2="180"></line>
    <line x1="710" y1="180" x2="860" y2="180"></line>
