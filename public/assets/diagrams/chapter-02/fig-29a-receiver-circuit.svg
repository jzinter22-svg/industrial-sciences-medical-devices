    <text x="400" y="230" font-family="Cairo, sans-serif" font-size="10" font-weight="700" fill="#263238">R6</text>

    <!-- C5 C6 C7 -->
    <line x1="450" y1="60" x2="450" y2="300"></line>
    <line x1="440" y1="150" x2="460" y2="150"></line>
    <line x1="440" y1="158" x2="460" y2="158"></line>
    <text x="465" y="155" font-family="Cairo, sans-serif" font-size="10" font-weight="700" fill="#263238">C5</text>

    <line x1="510" y1="60" x2="510" y2="300"></line>
    <line x1="500" y1="150" x2="520" y2="150"></line>
    <line x1="500" y1="158" x2="520" y2="158"></line>
    <text x="525" y="155" font-family="Cairo, sans-serif" font-size="10" font-weight="700" fill="#263238">C6</text>

    <!-- D2 -->
    <path d="M 550,140 L 565,150 L 550,160 Z" fill="#263238"></path>
