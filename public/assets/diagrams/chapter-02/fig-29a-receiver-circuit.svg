    <text x="180" y="95" font-family="Cairo, sans-serif" font-size="10" font-weight="700" fill="#263238">R2</text>

    <line x1="118" y1="216" x2="170" y2="216"></line>
    <line x1="140" y1="216" x2="140" y2="240"></line>
    <line x1="130" y1="240" x2="150" y2="240"></line>
    <line x1="130" y1="248" x2="150" y2="248"></line>
    <text x="155" y="255" font-family="Cairo, sans-serif" font-size="10" font-weight="700" fill="#263238">C2</text>

