    <text x="70" y="175" font-family="Cairo, sans-serif" font-size="10" font-weight="700" fill="#263238">T1 3:1</text>
    <line x1="60" y1="180" x2="60" y2="60"></line>
    <line x1="60" y1="252" x2="60" y2="300"></line>

    <!-- C1 R1 -->
