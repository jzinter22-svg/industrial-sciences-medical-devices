  <text x="150" y="330" font-family="Cairo, sans-serif" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle" direction="rtl">مستلمة الموجات فوق الصوتي</text>
  <text x="500" y="330" font-family="Cairo, sans-serif" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle" direction="rtl">الكاشف</text>
  <text x="780" y="200" font-family="Cairo, sans-serif" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle" direction="rtl">خرج الدائرة</text>
